<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mantiene los mismos bordes redondeados de tu código original -->
    <clipPath id="rounded">
      <rect width="1200" height="180" rx="18"/>
    </clipPath>
    
    <!-- Filtro SVG para simular la textura de brocha o acuarela -->
    <filter id="brush-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Cuadrícula sutil encima (Estilo Tech/GitHub) con baja opacidad -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Fondo base oscuro -->
    <rect width="1200" height="180" fill="#0d1117" />

    <!-- ========================================== -->
    <!-- CAPA BASE SÓLIDA DE RESPALDO (SELLA COSTURAS) -->
    <!-- Una bandera de Ecuador sólida debajo para que -->
    <!-- no se vea el fondo oscuro si el filtro falla. -->
    <!-- ========================================== -->
    <g opacity="0.1">
      <rect width="1200" height="90" fill="#FCD116"/>
      <rect x="0" y="90" width="1200" height="45" fill="#0033A0"/>
      <rect x="0" y="135" width="1200" height="45" fill="#CE1126"/>
    </g>

    <!-- ========================================== -->
    <!-- FRANJA AMARILLA (Ocupa el 50% superior)-->
    <!-- EXTENDIDA MASIVAMENTE POR DEBAJO (HASTA 120) -->
    <!-- ========================================== -->
    <g filter="url(#brush-texture)">
      <path d="M-20,-20 L1220,-20 L1220,130 Q900,140 600,110 T-20,130 Z" fill="#FCD116" />
      <!-- Variación de color para profundidad -->
      <path d="M-20,70 Q 300,110 600,80 T 1220,100 L 1220,-20 L -20,-20 Z" fill="#FFD100" opacity="0.8" />
    </g>

    <!-- ========================================== -->
    <!-- FRANJA AZUL (Ocupa el 25% central: 90-135) -->
    <!-- EXTENDIDA POR ARRIBA (DESDE 70) Y ABAJO (HASTA 160) -->
    <!-- Superpone al amarillo y base para sellar -->
    <!-- ========================================== -->
    <g filter="url(#brush-texture)">
      <path d="M-20,70 Q 300,110 600,85 T 1220,100 L 1220,170 Q 900,155 600,175 T -20,165 Z" fill="#0033A0" />
      <!-- Variación de color para profundidad -->
      <path d="M-20,95 Q 250,80 550,120 T 1220,100 L 1220,155 Q 750,170 450,140 T -20,160 Z" fill="#0044CC" opacity="0.7" />
    </g>

    <!-- ========================================== -->
    <!-- FRANJA ROJA (Ocupa el 25% inferior: 135-180) -->
    <!-- Superpone al azul y base para sellar -->
    <!-- ========================================== -->
    <g filter="url(#brush-texture)">
      <path d="M-20,135 Q 300,165 600,140 T 1220,155 L 1220,200 L -20,200 Z" fill="#CE1126" />
      <!-- Variación de color para profundidad -->
      <path d="M-20,140 Q 250,120 550,150 T 1220,125 L 1220,200 L -20,200 Z" fill="#E61A30" opacity="0.8" />
    </g>
    
    <!-- Aplica la cuadrícula encima -->
    <rect width="1200" height="180" fill="url(#grid)" />
  </g>
</svg>
